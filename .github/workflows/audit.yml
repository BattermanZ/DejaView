name: Audit

# Checks every crate in Cargo.lock against the RustSec advisory database:
# weekly, since an advisory can appear for a crate nothing here changed, and
# whenever the dependencies change. GitHub runs scheduled workflows from the
# default branch, `main`, so the weekly run starts once a release carries
# this file there.

on:
  schedule:
    - cron: "23 5 * * 1"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a vulnerability. Unmaintained and yanked crates are listed
      # as warnings for the maintainer to weigh.
      - name: Audit
        run: cargo audit
