[package]
name = "dejaview"
version = "0.1.0"
edition = "2024"
# File::try_lock, which takes the run lock, is stable from 1.89.
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Replace downloads that duplicate files in your media library with hardlinks"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.5"
rayon = "1.12"
anyhow = "1.0"
indicatif = "0.18"
pathdiff = "0.2"
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1"
comfy-table = "8.0"
dirs = "7.0"
ratatui = "0.30"
crossterm = "0.29"
ctrlc = { version = "3.5.2", features = ["termination"] }
